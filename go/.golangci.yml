version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: all
  disable:
    - depguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - ireturn
    - lll
    - musttag
    - nlreturn
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - '!$test'
          allow:
            - $gostd
            - github.com/tecnickcom
        test:
          files:
            - $test
          allow:
            - $gostd
            - github.com/stretchr
    funlen:
      lines: 100
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 10
    gosec:
      excludes:
        - G103
        - G115
    misspell:
      locale: US
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # dupSubExpr fires on the code cgo generates for the mmap_binfile call.
      - linters:
          - gocritic
        text: dupSubExpr
        path: binsearch.go
      # The test suite uses package-level fixtures shared by the table-driven
      # tests and by the benchmarks, so it cannot run in parallel.
      - linters:
          - dupl
          - funlen
          - gochecknoglobals
          - gocognit
          - gocritic
          - paralleltest
          - tparallel
        path: _test.go
    paths:
      - .github
      - .githook
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - .github
      - .githook
      - third_party$
      - builtin$
      - examples$
